<title>向日葵防线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#0a0f14; --bg:#0b1016; --panel:rgba(14,22,30,.94); --panel2:#17232e;
  --edge:#4b6378; --edge2:#2a3b4b; --text:#e6edf2; --dim:#93a7b7; --faint:#5f7485;
  --sun:#f2c230; --sun2:#ffe07a; --blue:#4aa3ff; --red:#ff4a2b; --ok:#7bd650;
  --f-ui:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-disp:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  --f-px:"Silkscreen",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased;user-select:none}
[hidden]{display:none!important}
#stage{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;cursor:default}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.num{font-family:var(--f-px);font-weight:400;font-variant-numeric:tabular-nums}
.pf{image-rendering:pixelated;display:block;width:48px;height:48px;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--edge)}
.pf.big{width:72px;height:72px}
.layer{position:fixed;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}

/* shared panel look: dark plate, light hairline, inner shadow, clipped corner */
.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--ink),0 6px 0 rgba(0,0,0,.35);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));position:relative}
.panel h4,.ph{margin:0;font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;background:#1c2a36;border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--ink),0 4px 0 #05080b;font-weight:700;letter-spacing:.06em;transition:transform .08s,background .12s}
.btn:hover:not(:disabled){background:#243747;border-color:#6d8aa2}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--ink),0 2px 0 #05080b}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{font-family:var(--f-px);font-size:11px;font-weight:400;color:var(--dim)}
.btn.primary{background:var(--sun);color:#1a1405;border-color:var(--sun2);box-shadow:inset 0 0 0 2px #8a6a10,0 4px 0 #5a4506}
.btn.primary:hover:not(:disabled){background:#ffd24a}
.btn.big{padding:14px 30px;font-size:17px}
.btn.small{padding:6px 12px;font-size:12px}
.mcode{font-family:var(--f-px);font-size:12px;background:var(--sun);color:#1a1405;padding:2px 6px;line-height:1.3}
.mcode.big{font-size:16px;padding:6px 10px}
.cells{display:inline-flex;gap:3px;vertical-align:middle}
.cells i{width:14px;height:22px;background:#1b2833;border:1px solid #34495a;display:block}
.cells i.on{background:var(--sun);border-color:var(--sun2);box-shadow:inset 0 -5px 0 #c99a1b}
.cells.warn i.on{background:#ff8a3a;border-color:#ffc08a;box-shadow:inset 0 -5px 0 #c55a1d}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:9px;height:11px;background:#23332c;border:1px solid var(--ink);display:block}
.pips i.on{background:var(--ok);box-shadow:inset 0 2px 0 #b8f59a}
.pips.ru i.on{background:#ff6b4f;box-shadow:inset 0 2px 0 #ffb3a3}
.objs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.objs li{display:grid;grid-template-columns:14px 1fr auto;gap:4px 9px;align-items:center;font-size:13px}
.objs li i{width:12px;height:12px;border:2px solid var(--edge);display:block}
.objs li.primary i{border-color:var(--sun)}
.objs li.bonus i{border-color:var(--blue);transform:rotate(45deg) scale(.85)}
.objs li.ok i{background:var(--ok);border-color:var(--ok)}
.objs li.bad i{background:var(--red);border-color:var(--red)}
.objs li em{grid-column:2/4;font-style:normal;font-size:11px;color:var(--sun);margin-top:-3px}
.objs li b{font-size:12px;color:var(--dim)}

/* ---------- title ---------- */
#title{background:linear-gradient(90deg,rgba(8,12,16,.96) 0%,rgba(8,12,16,.86) 34%,rgba(8,12,16,.2) 62%,rgba(8,12,16,0) 100%)}
.tbox{position:absolute;left:clamp(24px,6vw,96px);top:50%;transform:translateY(-50%);display:grid;gap:28px;max-width:520px}
.logo{display:grid;gap:10px}
.logo .date{font-family:var(--f-px);font-size:12px;letter-spacing:.3em;color:var(--sun)}
.logo h1{margin:0;white-space:nowrap;font-family:var(--f-disp);font-weight:400;font-size:clamp(52px,7.4vw,104px);line-height:.95;letter-spacing:.02em;text-shadow:4px 4px 0 var(--ink),0 0 40px rgba(242,194,48,.12)}
.logo h1 span{color:var(--sun)}
.logo .en{font-family:var(--f-px);font-size:clamp(13px,1.6vw,18px);letter-spacing:.5em;color:#c9d2d8}
.logo p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.7;max-width:34em}
.menu{display:grid;gap:10px;justify-items:start}
.menu .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tfoot{position:absolute;left:clamp(24px,6vw,96px);bottom:22px;font-size:11px;color:var(--faint);letter-spacing:.05em}

/* ---------- story ---------- */
#story{background:rgba(5,8,11,.97);display:grid;place-items:center;cursor:pointer}
#storyText{max-width:min(760px,86vw);text-align:center;font-size:clamp(18px,2.4vw,26px);line-height:1.7;font-weight:500;opacity:0;text-wrap:balance}
#storyText.in{animation:sin 1s ease forwards}
@keyframes sin{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.cont{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:12px;color:var(--faint);letter-spacing:.2em}

/* ---------- campaign ---------- */
.ctop{position:absolute;left:24px;top:18px;display:flex;align-items:baseline;gap:14px}
.ctop h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:30px}
.ctop span{color:var(--dim);font-size:12px;letter-spacing:.14em}
.cside{position:absolute;right:20px;top:20px;bottom:20px;width:min(380px,40vw);display:flex;flex-direction:column;gap:12px}
.cside .panel{padding:14px 16px;display:grid;gap:10px;align-content:start}
.cells + .num{margin-left:10px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.res .aid{display:flex;align-items:center;gap:8px}
.res .aid b{font-size:20px;color:var(--sun)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge2)}
.mrow:last-child{border-bottom:0}
.mrow .mname{font-weight:700;display:grid}
.mrow .mname small{font-weight:400;color:var(--dim);font-size:11px}
.mrow .mstate{font-size:11px;color:var(--dim)}
.mrow.done .mcode{background:var(--ok)}
.mrow.locked{opacity:.45}
.mrow.locked .mcode{background:var(--faint)}
.mrow.cur .mstate{color:var(--sun)}
.mtitle{display:flex;gap:12px;align-items:center}
.mtitle h3,#bHead h3{margin:0;font-size:20px}
.mtitle small,#bHead small{color:var(--dim);font-size:12px}
.warn{margin:0;color:#ff9a7a;font-size:12px}
.cside .grow{flex:1}

/* ---------- briefing ---------- */
#briefing{background:rgba(6,10,14,.55)}
#bHead{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 20px}
#bDialog{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(920px,92vw);padding:18px 20px 18px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;cursor:pointer}
#bDialog .pf{width:112px;height:112px}
#dName{font-size:18px;font-weight:900;color:var(--sun);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#dName small{font-size:12px;font-weight:400;color:var(--dim)}
#dText{margin:8px 0 0;font-size:17px;line-height:1.75;min-height:3.5em}
.dfoot{position:absolute;right:16px;bottom:10px;display:flex;gap:12px;align-items:center;font-size:11px;color:var(--faint)}
#bCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);width:min(760px,92vw);padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
#bCard .full{grid-column:1/-1}
#bCard ul.intel,#bCard ul.tips{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
#bCard ul.intel li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--edge2);padding-bottom:4px}
#bCard ul.intel b{font-family:var(--f-px);font-weight:400;color:#ff8b73}
#bCard ul.tips li{color:#c4d1dc;padding-left:14px;position:relative;line-height:1.6}
#bCard ul.tips li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--sun)}
#bCard .go{display:flex;justify-content:flex-end}

/* ---------- battle HUD ---------- */
.hl{position:absolute;left:14px;top:14px;display:grid;gap:10px;width:min(300px,34vw)}
.hl .panel{padding:10px 14px;display:grid;gap:8px}
.ht{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ht .tn{display:flex;align-items:baseline;gap:6px}
.ht .tn .num{font-size:24px;color:var(--sun)}
.ht .tn span{color:var(--dim);font-family:var(--f-px);font-size:12px}
#hMission{font-size:12px;color:var(--dim)}
.roster{display:grid;gap:6px}
.rchip{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:6px 10px 6px 6px;background:var(--panel);border:2px solid var(--edge2);text-align:left}
.rchip .pf{grid-row:1/3;width:38px;height:38px}
.rchip span{font-weight:700;font-size:13px}
.rchip em{font-style:normal;font-size:11px;color:var(--dim);grid-column:3;grid-row:1}
.rchip .pips{grid-column:2/4;grid-row:2}
.rchip:hover{border-color:var(--edge)}
.rchip.sel{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.rchip.done{opacity:.6}
.rchip.dead{opacity:.35}
.picklist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rchip.pick{grid-template-columns:auto 1fr auto;grid-template-rows:auto;column-gap:8px;padding:5px 8px}
.rchip.pick .pf{grid-row:auto;width:26px;height:26px}
.rchip.pick em{grid-column:auto;grid-row:auto;color:var(--sun)}
.rchip.pick.off{opacity:.4;cursor:not-allowed}
.rchip.pick:not(.off):hover{border-color:var(--edge)}
.pkhead{display:flex;justify-content:space-between;align-items:baseline}
.pkhead .num{font-family:var(--f-px);font-size:12px;color:var(--sun)}
.roster.big{grid-template-columns:1fr 1fr;gap:5px}
.roster.big .rchip{padding:4px 6px 4px 4px}
.roster.big .rchip .pf{width:30px;height:30px}
.shead{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:10px;border-bottom:1px solid var(--edge2);padding-bottom:4px}
.nonerep{font-size:12px;color:var(--faint);padding:6px 0}
.hr{position:absolute;right:14px;top:14px;width:min(300px,32vw);padding:12px 14px;display:grid;gap:10px}
#tip{position:absolute;right:14px;top:auto;bottom:110px;width:min(300px,32vw);padding:12px 14px;display:grid;gap:4px;font-size:12px;pointer-events:none}
#tip h5{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#tip p{margin:0;color:#c4d1dc;line-height:1.55}
#tip .threat{color:#ff9a7a}
#tip .coord{position:absolute;right:12px;top:-2px;font-family:var(--f-px);font-size:10px;color:var(--faint)}
#tip h5 + p,#tip p + h5{margin-top:2px}
#unitCard{position:absolute;left:14px;bottom:14px;width:min(420px,46vw);padding:12px 14px;display:grid;gap:10px}
.uc-head{display:flex;gap:12px;align-items:center}
.uc-head h4{font-size:17px;color:var(--text);letter-spacing:0;font-weight:900}
.uc-head small{color:var(--dim);font-size:12px}
.uc-stats{display:flex;gap:12px;align-items:center;margin-top:4px;font-size:12px;color:var(--dim)}
.weps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wep{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;padding:8px 10px;background:#1a2733;border:2px solid var(--edge2);box-shadow:inset 0 0 0 1px var(--ink)}
.wep .key{grid-row:1/3;font-family:var(--f-px);font-size:11px;color:var(--ink);background:var(--dim);width:18px;height:18px;display:grid;place-items:center;align-self:start;margin-top:2px}
.wep .wn{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.wep .ammo{font-family:var(--f-px);font-weight:400;font-size:11px;color:var(--ink);background:var(--sun);padding:0 5px}
.wep .wd{font-size:11px;color:var(--dim);line-height:1.45}
.wep:hover:not(:disabled){border-color:var(--edge)}
.wep.on{border-color:var(--sun);background:#2d2a12}
.wep.on .key{background:var(--sun)}
.wep:disabled{opacity:.4;cursor:not-allowed}
.hbr{position:absolute;right:14px;bottom:14px;display:flex;gap:10px;align-items:stretch}
#btnTB2{display:flex;gap:8px;align-items:center}
#btnTB2 .ico{font-size:18px;color:var(--sun)}
#btnTB2 span{display:grid;text-align:left;line-height:1.2}
#btnTB2.on{border-color:var(--sun);background:#2d2a12}
#btnReset{display:grid;line-height:1.2}
#btnEnd{min-width:150px;font-size:17px}
#deploy{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:14px 18px;display:flex;gap:18px;align-items:center}
#deploy p{margin:0;font-size:13px;color:#c4d1dc;max-width:30em;line-height:1.6}
#deploy b{color:var(--sun)}
#toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{background:rgba(10,15,20,.9);border:1px solid var(--edge);padding:6px 14px;font-size:13px;font-weight:500;animation:tin .25s ease}
.toast.good{border-color:var(--ok);color:#c8f5b0}
.toast.bad{border-color:var(--red);color:#ffc2b3}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0}
.banner span{display:inline-block;font-family:var(--f-disp);font-size:clamp(30px,4.4vw,52px);padding:8px 60px;background:linear-gradient(90deg,transparent,rgba(8,12,16,.92) 20%,rgba(8,12,16,.92) 80%,transparent);border-top:2px solid var(--sun);border-bottom:2px solid var(--sun);text-shadow:3px 3px 0 var(--ink)}
.banner.enemy span{border-color:var(--red);color:#ffd9cf}
.banner.show{animation:ban 1.5s ease both}
@keyframes ban{0%{opacity:0;letter-spacing:.4em}15%,75%{opacity:1;letter-spacing:.08em}100%{opacity:0}}
#hint{position:absolute;left:50%;bottom:168px;transform:translateX(-50%);background:rgba(10,15,20,.9);border:1px solid var(--sun);padding:6px 14px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#hint.show{opacity:1}
#radio{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);display:flex;gap:10px;align-items:center;background:rgba(10,15,20,.94);border:2px solid var(--edge);padding:8px 16px 8px 8px;max-width:min(560px,60vw);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#radio.show{opacity:1;transform:translate(-50%,0)}
#radio .pf{width:44px;height:44px}
#radio b{display:block;font-size:12px;color:var(--sun);letter-spacing:.1em}
#radio span{font-size:14px;line-height:1.5}

/* ---------- debrief ---------- */
#debrief{background:rgba(6,10,14,.8);display:grid;place-items:center;padding:20px;overflow:auto}
.db{width:min(1040px,96vw);display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.db .panel{padding:20px 22px;display:grid;gap:14px;align-content:start}
#dbTitle{display:flex;gap:14px;align-items:center}
#dbTitle h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:40px;line-height:1}
#dbTitle small{color:var(--dim)}
#dbTitle .good{color:var(--ok)} #dbTitle .mid{color:var(--sun)} #dbTitle .bad{color:var(--red)}
#dbText{margin:0;line-height:1.8;color:#d6dee5;font-size:14px}
#dbStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#dbStats div{background:#111b24;border:1px solid var(--edge2);padding:10px;display:grid;gap:2px}
#dbStats b{font-size:20px;color:var(--sun)}
#dbStats span{font-size:11px;color:var(--dim)}
#dbConseq{margin:0;color:#ff9a7a;font-size:13px;border-left:3px solid var(--red);padding-left:10px}
#dbConseq.calm{color:#c8f5b0;border-color:var(--ok)}
.shophead{display:flex;justify-content:space-between;align-items:center}
.shophead b{font-size:22px;color:var(--sun)}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{display:grid;gap:4px;text-align:left;padding:10px 12px;background:#1a2733;border:2px solid var(--edge2);box-shadow:inset 0 0 0 1px var(--ink)}
.up:hover:not(:disabled){border-color:var(--sun)}
.up:disabled{opacity:.45;cursor:not-allowed}
.up .uname{font-weight:700;font-size:14px}
.up .uname small{font-family:var(--f-px);font-size:10px;color:var(--dim)}
.up .udesc{font-size:12px;color:var(--dim);line-height:1.5}
.up .ucost{font-size:12px;color:var(--sun);font-weight:700}
.dbgo{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:900px){
  .db{grid-template-columns:1fr}
  .cside{width:min(360px,52vw)}
  .weps{grid-template-columns:1fr}
  #tip{display:none!important}
}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none;opacity:1}#storyText.in{animation:none;opacity:1}}
</style>

<canvas id="stage" aria-label="战场"></canvas>

<section id="title" class="layer">
  <div class="tbox">
    <div class="logo">
      <span class="date">KYIV · 2022</span>
      <h1>向日葵<span>防线</span></h1>
      <span class="en">SUNFLOWER LINE</span>
      <p>回合制战术。敌人的每一次攻击都会提前被情报标出。指挥三支小分队，守住基辅的门户。</p>
    </div>
    <div class="menu">
      <button class="btn primary big" id="btnNew" type="button">开始战役</button>
      <button class="btn" id="btnContinue" type="button" hidden>继续战役</button>
      <div class="row">
        <button class="btn small" id="btnSound" type="button">声音：开</button>
        <button class="btn small" id="btnMusic" type="button">音乐：开</button>
        <button class="btn small" id="btnSpeed" type="button">动画：标准</button>
      </div>
    </div>
  </div>
  <div class="tfoot">第一章 · 基辅保卫战 · 人物为虚构，事件依据公开史实改编</div>
</section>

<section id="story" class="layer" hidden>
  <div id="storyText"></div>
  <div class="cont">点击跳过</div>
</section>

<section id="campaign" class="layer" hidden>
  <div class="ctop"><h2 id="cTitle"></h2><span id="cSub"></span></div>
  <aside class="cside">
    <div class="panel">
      <div class="res"><span class="ph">国际援助</span><span class="aid"><b class="num" id="cAid">0</b></span></div>
    </div>
    <div class="panel"><span class="ph">战役进程</span><div id="cList"></div></div>
    <div class="panel grow"><span class="ph">下一个任务</span><div id="cMission"></div></div>
    <button class="btn primary big" id="btnBrief" type="button">任务简报</button>
  </aside>
</section>

<section id="briefing" class="layer" hidden>
  <div id="bHead" class="panel"></div>
  <div id="bDialog" class="panel">
    <img id="dPortrait" class="pf" alt="">
    <div><div id="dName"></div><p id="dText"></p></div>
    <div class="dfoot"><span>点击继续</span><button class="btn small" id="btnSkip" type="button">跳过对话</button></div>
  </div>
  <div id="bCard" class="panel" hidden>
