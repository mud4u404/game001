name: check
on:
  push:
    branches: ['zcode/**', 'main']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 语法与改动范围
        run: node tools/check.js
      - name: 自动试玩整章
        run: node tools/playtest.js playtest-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots
          path: playtest-out/
          retention-days: 14
